name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smartbin
          POSTGRES_PASSWORD: smartbin123
          POSTGRES_DB: smartbin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run migrations
      run: npm run db:migrate
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: smartbin_test
        DB_USER: smartbin
        DB_PASSWORD: smartbin123
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret-key

    - name: Run tests
      run: npm test
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: smartbin_test
        DB_USER: smartbin
        DB_PASSWORD: smartbin123
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret-key

    - name: Run linter
      run: npm run lint
